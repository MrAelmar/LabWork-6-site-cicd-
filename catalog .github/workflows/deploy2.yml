- name: Lint HTML and CSS
  uses: github/super-linter@v5
  env:
    VALIDATE_ALL_CODEBASE: false # Проверять только измененные файлы (быстрее)
    DEFAULT_BRANCH: main
    GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    VALIDATE_HTML: true
    VALIDATE_CSS: true
    # Отключаем линтинг других языков, если они не нужны
    VALIDATE_JAVASCRIPT_ES: false
    VALIDATE_YAML: false
