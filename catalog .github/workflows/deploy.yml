name: Deploy with Linting

on:
  push:
    branches: [ main ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Super-Linter (HTML/CSS)
        uses: github/super-linter@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VALIDATE_ALL_CODEBASE: false      # проверять только изменённые файлы
          VALIDATE_HTML: true               # включить проверку HTML
          VALIDATE_CSS: true                # включить проверку CSS
          DEFAULT_BRANCH: main

  deploy:
    runs-on: ubuntu-latest
    needs: lint                             # деплой только после успешного линтинга
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      # ... ваши шаги деплоя ...
name: Deploy static site
on:
  push:
    branches: [main]
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
